<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="HEMOS Studio creates professional business websites, e-commerce websites, landing pages, UI/UX designs, and digital web solutions.">
    <meta property="og:title" content="HEMOS Studio | High End Modern Online Solution">
    <meta property="og:description" content="Launch your business online with HEMOS Studio's professional website development and digital web services.">
    <meta property="og:type" content="website">
    <title>HEMOS Studio | High End Modern Online Solution</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #111111;
        }

        header {
            width: 100%;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eeeeee;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        nav a {
            margin-left: 25px;
            text-decoration: none;
            color: #111111;
        }

        .hero {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        .hero-content {
            max-width: 800px;
        }

        .hero h1 {
            font-size: 56px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #555555;
        }

        .btn {
            display: inline-block;
            padding: 14px 30px;
            background: #111111;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
        }

        @media (max-width: 768px) {
            header {
                padding: 18px 20px;
            }

            nav {
                display: none;
            }

            .hero h1 {
                font-size: 38px;
            }

            .hero p {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
